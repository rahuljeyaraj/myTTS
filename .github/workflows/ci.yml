name: CI

# The tests, on every push to main and every pull request. Python 3.13 uses the exact versions a
# release is built with (packaging/requirements-lock.txt); 3.11, the oldest supported Python, uses
# the newest versions requirements.txt allows there (and the pinned PyInstaller), so a breaking
# upstream release, or one that drops 3.11, shows up here first.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.13"
            requirements: -r packaging/requirements-lock.txt
          - python: "3.11"
            requirements: -r requirements.txt -r packaging/requirements-build.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-lock.txt

      - name: Install
        run: |
          python -m pip install --disable-pip-version-check ${{ matrix.requirements }} pytest
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m pip check

      - name: Test
        run: python -m pytest -q
