[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mytts"
dynamic = ["version"]
description = "Offline, minimalist read-aloud app for Windows: select text, press a hotkey, listen."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"  # kokoro-onnx does not support 3.14 yet
dependencies = [
    "kokoro-onnx>=0.6.1",
    "numpy>=2.0",
    "sounddevice>=0.5",
    "PySide6-Essentials>=6.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mytts = "mytts.__main__:main"

[tool.setuptools]
packages = ["mytts", "mytts.ui"]

[tool.setuptools.dynamic]
version = { attr = "mytts.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
